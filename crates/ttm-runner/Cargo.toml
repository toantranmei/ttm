[package]
name = "ttm-runner"
description = "Local agent runner for ttm: takes jobs from the server, runs a coding agent in a git worktree, streams events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sysinfo = { version = "0.40.1", default-features = false, features = ["system"] }
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ttm-api.workspace = true
ttm-core.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
sha2.workspace = true
toml_edit.workspace = true
ttm-ui.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["process"] }

[dev-dependencies]
wiremock.workspace = true

[features]
# Scripted fake harness `ttm-sim` for the end-to-end simulation (M4). Never in `default`, never built by cargo-dist
# (it builds default features), so no released binary has it.
sim-harness = []

[lints]
workspace = true

[package.metadata.dist]
dist = false
