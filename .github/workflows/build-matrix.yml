name: Build matrix

# Release builds of every target. Not on every push (CI already tests on Linux, macOS and Windows, and a release tag
# builds all targets again): only when something that changes the build does, weekly, or by hand.
on:
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - dist-workspace.toml
      - .github/build-setup.yml
      - .github/workflows/build-matrix.yml
      - .github/workflows/release.yml
  pull_request:
    paths:
      - Cargo.lock
      - "**/Cargo.toml"
      - rust-toolchain.toml
      - dist-workspace.toml
      - .github/build-setup.yml
      - .github/workflows/build-matrix.yml
      - .github/workflows/release.yml
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: build-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both macOS targets on one runner (macOS runners are scarce; arm64 cross-builds x86_64 natively).
          - { target: aarch64-apple-darwin x86_64-apple-darwin, toolchain_targets: 'aarch64-apple-darwin,x86_64-apple-darwin', os: macos-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain_targets || matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}-${{ matrix.toolchain_targets || matrix.target }}
      - shell: bash
        run: |
          for target in ${{ matrix.target }}; do
            cargo build --release --locked --target "$target" -p ttm-cli -p ttm-mcp
          done

